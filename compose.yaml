services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ev
      POSTGRES_PASSWORD: ev
      POSTGRES_DB: ev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ev
      MINIO_ROOT_PASSWORD: ev-secret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      EV_DATABASE_URL: postgresql+psycopg://ev:ev@db:5432/ev
      EV_REDIS_URL: redis://redis:6379/0
      EV_OBJECT_STORE_BACKEND: s3
      EV_S3_ENDPOINT_URL: http://minio:9000
      EV_S3_BUCKET: ev
      EV_S3_ACCESS_KEY: ev
      EV_S3_SECRET_KEY: ev-secret
      EV_PROCESSING_MODE: queue
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.runner"]
    env_file: .env
    environment:
      EV_DATABASE_URL: postgresql+psycopg://ev:ev@db:5432/ev
      EV_REDIS_URL: redis://redis:6379/0
      EV_OBJECT_STORE_BACKEND: s3
      EV_S3_ENDPOINT_URL: http://minio:9000
      EV_S3_BUCKET: ev
      EV_S3_ACCESS_KEY: ev
      EV_S3_SECRET_KEY: ev-secret
      EV_PROCESSING_MODE: queue
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.scheduler"]
    env_file: .env
    environment:
      EV_DATABASE_URL: postgresql+psycopg://ev:ev@db:5432/ev
      EV_REDIS_URL: redis://redis:6379/0
      EV_OBJECT_STORE_BACKEND: s3
      EV_S3_ENDPOINT_URL: http://minio:9000
      EV_S3_BUCKET: ev
      EV_S3_ACCESS_KEY: ev
      EV_S3_SECRET_KEY: ev-secret
      EV_PROCESSING_MODE: queue
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  miniodata:
