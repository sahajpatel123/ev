[project]
name = "ev-backend"
version = "0.1.0"
description = "EV — personal AI companion with lifelong memory (JARVIS-style, Spider-Man E.V.-inspired)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "aiosqlite>=0.20",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
  "cryptography>=50.0.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]
ml = [
  "onnxruntime>=1.20,<1.29",
  "numpy>=1.26,<3",
  "tokenizers>=0.20",
  "datasets>=3.0",
  "faster-whisper>=1.1,<1.3",
  "openwakeword>=0.6,<0.7; sys_platform == 'darwin'",
  "kokoro-onnx>=0.5,<0.6",
  "edge-tts>=7.0",
  "sounddevice>=0.5; sys_platform == 'darwin'",
  "kaldi-native-fbank>=1.20,<2",
]
mlx = [
  "mlx>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm>=0.31,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-tune>=0.5,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
face = [
  "opencv-python-headless>=4.10,<5",
  "pillow>=10",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "clients", "eval"]

[tool.hatch.build.targets.wheel.force-include]
"clients/web" = "clients/web"

[project.scripts]
ev = "clients.cli:main"
ev-eval = "eval.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.uv]
# openwakeword 0.6.0 requires tflite-runtime on Linux, which has no wheels for
# Python >= 3.15 yet; keep the universal lock to platforms/versions that can
# actually resolve (macOS for this machine, Linux/Windows < 3.15 for CI).
environments = [
  "sys_platform == 'darwin'",
  "sys_platform == 'linux' and python_full_version < '3.15'",
  "sys_platform == 'win32' and python_full_version < '3.15'",
]
